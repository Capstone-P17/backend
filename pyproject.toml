[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "langchain>=0.3.0",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langgraph>=0.2.0",
    "langsmith>=0.7.31",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "psycopg[binary]>=3.2.10",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.41",
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "urllib3>=2.7.0",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
